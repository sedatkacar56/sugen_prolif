<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sugen Parse Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="sidebar">
      <h2>Sugen Parse Project</h2>
      <div id="autocomplete-wrapper">
        <input id="geneInput" type="text" placeholder="Type gene, e.g. Pecam1" autocomplete="off">
        <div id="suggestions"></div>
      </div>
      <button id="loadBtn">Load gene</button>

      <div class="control-group">
        <label>Plot mode</label>
        <div class="toggle">
          <button id="modeFeature" class="mode-btn active">Feature plot</button>
          <button id="modeDotplot" class="mode-btn">Dot plot</button>
        </div>
      </div>

      <div class="control-group" id="cellTypeWrapper" style="display:none">
        <label for="cellTypeSelect">Cell type</label>
        <select id="cellTypeSelect">
          <option value="__all__">All cell types</option>
        </select>
      </div>

      <div id="status">Loading UMAP...</div>
    </div>

    <div class="main">
      <div id="plot"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
